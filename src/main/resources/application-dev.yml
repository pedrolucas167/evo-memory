spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/evomemory
    username: ${DB_USER:evomemory}
    password: ${DB_PASSWORD:evomemory}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

logging:
  level:
    com.polon.evomemory: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

server:
  address: 127.0.0.1

memory:
  auth:
    mode: local
    local-key-file: ${AUTH_LOCAL_KEY_FILE:.local/auth-secret}
