spring:
  application:
    name: evo-memory
  datasource:
    url: jdbc:postgresql://localhost:5433/evomemory
    username: evomemory
    password: evomemory
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

memory:
  llm:
    base-url: https://openrouter.ai/api/v1
    api-key: ${OPENROUTER_API_KEY:}
    extraction-model: openai/gpt-6-luna
    judge-model: openai/gpt-6-luna
    chat-model: openai/gpt-6-luna
    embedding-model: baai/bge-m3
  retrieval:
    min-similarity: 0.42
    relative-margin: 0.05
    top-k: 8
