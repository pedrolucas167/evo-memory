services:
  postgres:
    env_file: .env
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: evomemory
      POSTGRES_USER: evomemory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evomemory}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
